# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- develop

pool:
  vmImage: 'ubuntu-22.04'

strategy:
  matrix:
    python31:
      python.version: '3.1'


steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Definir python 3.1'

- script: |
    pip install kedro==0.16.5
  displayName: 'Install Kedro'

- script: |
    # on force pip < 24.1 pour eviter le rejet de metadonnées de celery 5.0.5
    python -m  pip install "pip<24.1"
    pip install -r src/requirements.txt
  displayName: 'Installer les dependances'

- script: |
    pip install pytest pytest-azurepipelines pytest-cov
  displayName: Test code and publish results
