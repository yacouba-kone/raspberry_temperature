# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python
trigger:
- develop

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: '3.14'

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(PYTHON_VERSION)'
  displayName: 'Use Python $(PYTHON_VERSION)'

- script: |
    python --version
    python -m pip install --upgrade pip
    python -m pip install uv
    uv --version
  displayName: 'Install and check uv'

- script: |
    uv sync --frozen
    uv run python -c "import kedro_datasets; print('kedro-datasets OK')"
  displayName: 'Install and verify project dependencies'
  
- script: |
    uv run kedro --version
  displayName: 'Check Kedro'

- script: |
    uv run kedro catalog describe-datasets
  displayName: 'Validate Kedro catalog'

- script: |
    uv run pytest
  displayName: 'Run pytest'
