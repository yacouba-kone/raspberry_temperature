raw_data:
  type: json.JSONDataset
  filepath: azure://raspberry-temperature/01_raw/IntroMLops-1.json

message_broker:
  type: json.JSONDataset
  filepath: "abfs://raspberry-temperature/01_raw/message_from_message_broker.json"
  credentials: azure_blob

cleaned_data:
  type: pandas.ParquetDataset
  filepath: "abfs://raspberry-temperature/02_intermediate/cleaned_data.pq"
  credentials: azure_blob

x_train:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/x_train.pq

x_test:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/x_test.pq

y_train:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/y_train.pq

y_test:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/y_test.pq

model_temperature:
  type: pickle.PickleDataset
  filepath: abfs://raspberry-temperature/06_models/model_temperature.pkl
  credentials: azure_blob
  
